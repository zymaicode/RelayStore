<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云驿</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background:#0f1115; color:#e6e9ef; }
  header { padding:16px 20px; border-bottom:1px solid #222835; display:flex; align-items:center; gap:12px; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .tag { font-size:12px; padding:2px 8px; border-radius:999px; background:#1b2230; color:#8fb3ff; }
  main { padding:20px; display:grid; gap:16px; }
  .card { background:#141922; border:1px solid #222835; border-radius:10px; padding:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input { background:#0b0f16; border:1px solid #2a3242; color:#e6e9ef; padding:8px 10px; border-radius:8px; width:110px; }
  input.wide { width:340px; }
  button { background:#2b6cff; border:0; color:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; }
  button.ghost { background:#1b2230; color:#c9d3e3; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .bar { height:10px; background:#0b0f16; border-radius:999px; overflow:hidden; border:1px solid #222835; }
  .bar > i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#2b6cff,#5ee0a0); transition:width .3s; }
  pre { margin:0; max-height:220px; overflow:auto; background:#0b0f16; border:1px solid #222835; border-radius:8px; padding:10px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #1d2431; }
  .ok { color:#5ee0a0; } .bad { color:#ff7a7a; } .muted { color:#8b97ac; }
  #overlay { position:fixed; inset:0; background:rgba(5,7,11,.72); display:none; align-items:center; justify-content:center; }
  #overlay.show { display:flex; }
  .modal { width:520px; background:#141922; border:1px solid #2a3242; border-radius:12px; padding:22px; }
  .modal h2 { margin:0 0 8px; font-size:16px; }
  .modal p { margin:0 0 12px; color:#a9b4c6; font-size:13px; }
  .modal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>云驿</h1>
  <span class="tag" id="data">keys: - · depots: -</span>
  <span class="tag" id="version">v-</span>
</header>
<main>
  <section class="card">
    <div class="row">
      <label>AppID <input id="appid" value="480" /></label>
      <label>安装目录 <input id="target" class="wide" value="D:/Games/480" /></label>
      <label>并行 depot <input id="depotWorkers" value="2" /></label>
      <button id="check">检查可用性</button>
      <button id="start" disabled>开始下载</button>
    </div>
    <div id="verdict" class="muted" style="margin-top:12px">等待检查…</div>
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <strong>进度</strong>
      <span id="stats" class="muted">idle</span>
    </div>
    <div class="bar" style="margin-top:10px"><i id="fill"></i></div>
    <table id="depots" style="margin-top:12px"></table>
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <strong>更新</strong>
      <button class="ghost" id="checkUpdate">检查更新</button>
    </div>
    <div id="updateInfo" class="muted" style="margin-top:10px">当前版本 -</div>
    <div class="bar" id="updateBarWrap" style="margin-top:10px;display:none"><i id="updateFill"></i></div>
    <div class="row" style="margin-top:10px">
      <button id="doUpdate" style="display:none">立即更新</button>
      <span id="updateHint" class="muted"></span>
    </div>
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <strong>设置</strong>
      <span id="modeTag" class="tag">-</span>
    </div>
    <div class="row" style="margin-top:12px">
      <label style="flex:1">数据目录 <input id="dataDir" class="wide" style="width:calc(100% - 90px)" /></label>
      <button class="ghost" id="pickData">浏览</button>
      <button class="ghost" id="openData">打开</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label style="flex:1">游戏目录 <input id="gameDir" class="wide" style="width:calc(100% - 90px)" /></label>
      <button class="ghost" id="pickGame">浏览</button>
      <button class="ghost" id="openGame">打开</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label>并行 depot <input id="cfgDepot" style="width:70px" /></label>
      <label>并行 chunk <input id="cfgChunk" style="width:70px" /></label>
      <button id="saveSettings">保存设置</button>
      <span id="saveHint" class="muted"></span>
    </div>
    <div class="muted" style="margin-top:10px;font-size:12px" id="settingsPath"></div>
  </section>
  <section class="card">
    <strong>日志</strong>
    <pre id="log"></pre>
  </section>
</main>

<div id="overlay">
  <div class="modal">
    <h2>缺少运行数据</h2>
    <p id="modalText">首次启动需要下载密钥语料（约 30 MB，来自社区镜像）。不下载的话无法判断游戏能否下载。</p>
    <div class="bar" style="margin-top:6px"><i id="dataFill"></i></div>
    <p id="dataStatus" class="muted" style="margin-top:8px">等待确认…</p>
    <div class="actions">
      <button class="ghost" id="later">稍后</button>
      <button id="downloadData">下载数据</button>
    </div>
  </div>
</div>

<script src="./main.js"></script>
</body>
</html>
