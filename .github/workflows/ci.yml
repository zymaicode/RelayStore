name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Go core
        run: |
          set -euo pipefail
          cd tools/relaycore
          go vet ./...
          go build ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check Python sources
        run: |
          set -euo pipefail
          python -m compileall -q src/py tests

  build-windows:
    name: build-windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build steamclient.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '0'
          Set-Location app/relaystore
          go build -tags 'desktop,production' -ldflags '-w -s -H windowsgui' -o relaystore.exe .
          if (-not (Test-Path relaystore.exe)) { throw 'build produced no exe' }
          Get-Item relaystore.exe | Select-Object Name, Length

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: relaystore-windows
          path: app/relaystore/relaystore.exe
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: relaystore-windows
          path: dist

      - name: Build source archive
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          NAME="relaystore-${REF}.zip"
          git archive --format=zip --prefix="relaystore-${REF}/" -o "$NAME" HEAD
          ls -l "$NAME" dist

      - name: Publish release (source zip + windows exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if gh release view "$REF" > /dev/null 2>&1; then
            gh release delete "$REF" --yes --cleanup-tag=false
          fi
          gh release create "$REF" "relaystore-${REF}.zip" dist/relaystore.exe \
            --title "$REF" \
            --notes "relaystore source snapshot + windows build for $REF"

      - name: Verify assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
          ZIPS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[] | select(.name|endswith(".zip"))] | length')
          EXES=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[] | select(.name|endswith(".exe"))] | length')
          test "$ZIPS" = "1"
          test "$EXES" = "1"
