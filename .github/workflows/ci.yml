name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Go core
        run: |
          set -euo pipefail
          cd tools/relaycore
          go vet ./...
          go build ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check Python sources
        run: |
          set -euo pipefail
          python -m compileall -q src/py tests

  build-windows:
    name: build-windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress -y
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path $nsis)) { throw 'NSIS install failed' }
          $nsis | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Build app and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '0'
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          Set-Location app/relaystore
          wails build -nsis -clean -ldflags "-X main.a1Version=$version"
          Get-ChildItem build/bin | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relaystore-windows
          path: |
            app/relaystore/build/bin/relaystore.exe
            app/relaystore/build/bin/*installer.exe
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: relaystore-windows
          path: dist

      - name: Build source archive
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          NAME="relaystore-${REF}.zip"
          git archive --format=zip --prefix="relaystore-${REF}/" -o "$NAME" HEAD
          ls -l dist "$NAME"

      - name: Build latest.json
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          EXE_SHA=$(sha256sum dist/relaystore.exe | cut -d' ' -f1)
          SETUP=$(ls dist/*installer*.exe | head -n1)
          SETUP_NAME=$(basename "$SETUP")
          SETUP_SHA=$(sha256sum "$SETUP" | cut -d' ' -f1)
          cat > dist/latest.json <<EOF
          {
            "version": "${REF}",
            "portable": { "name": "relaystore.exe", "sha256": "${EXE_SHA}" },
            "installer": { "name": "${SETUP_NAME}", "sha256": "${SETUP_SHA}" },
            "source": "relaystore-${REF}.zip"
          }
          EOF
          cat dist/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          if gh release view "$REF" > /dev/null 2>&1; then
            gh release delete "$REF" --yes --cleanup-tag=false
          fi
          gh release create "$REF" "relaystore-${REF}.zip" dist/relaystore.exe dist/*installer*.exe dist/latest.json \
            --title "$REF" \
            --notes "relaystore ${REF}"

      - name: Publish metadata to main (raw endpoint)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p updates
          cp dist/latest.json updates/latest.json
          git config user.name "relaystore-ci"
          git config user.email "ci@relaystore.local"
          git fetch origin main
          git checkout main
          git add updates/latest.json
          if git diff --cached --quiet; then
            echo "metadata unchanged"
          else
            git commit -m "chore: update latest.json [skip ci]"
            git push origin main
          fi

      - name: Verify assets and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[]|select(.name|endswith(".exe"))]|length')" -ge 2
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[]|select(.name=="latest.json")]|length')" = 1
